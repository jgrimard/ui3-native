[package]
name = "bi-media"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "FFmpeg-based hardware video decoding (D3D11VA) and audio output for Blue Iris streams"

[dependencies]
bi-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
ffmpeg-sys-next.workspace = true
cpal.workspace = true
rtrb.workspace = true
zune-jpeg.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tracing-subscriber.workspace = true
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }
