[package]
name = "ui3-native"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Native Windows client for Blue Iris, a Rust port of UI3 with direct H.265 playback"

[[bin]]
name = "ui3-native"
path = "src/main.rs"

[dependencies]
bi-proto.workspace = true
bi-media.workspace = true
bi-render.workspace = true
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
futures-util.workspace = true
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
image.workspace = true
directories.workspace = true
lru.workspace = true
rfd.workspace = true
gilrs.workspace = true
rumqttc.workspace = true
windows = { workspace = true, features = ["Win32_Security_Credentials", "Win32_Media_Speech", "Win32_System_Com", "Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }

[build-dependencies]
winresource = "0.1"
